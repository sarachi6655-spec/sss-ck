name: flutter_rich_editor
description: A private, configurable, CKEditor-style rich text editor plugin for the LIMS Flutter application.

publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # Core / UI
  intl: ^0.19.0

  # Media
  video_player: ^2.10.1
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2

  # Code / syntax highlighting
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0

  # Serialization
  html: ^0.15.4
  markdown: ^7.2.2
  flutter_quill: ^10.5.4

  # Export (reuses LIMS-compatible packages)
  pdf: ^3.10.8
  printing: ^5.13.1

  # Utilities
  path: ^1.9.0
  path_provider: ^2.1.3
  url_launcher: ^6.3.2
  file_picker: ^10.3.3

  # Optional provider contracts are declared as dev-only or host-supplied
  # so the package does not force AI/collaboration/vendor dependencies.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
