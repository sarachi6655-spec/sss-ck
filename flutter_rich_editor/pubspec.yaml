name: flutter_rich_editor
description: "A configurable, CKEditor-compatible rich text editor for Flutter with dynamic theming and full feature parity."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  html: ^0.15.4
  intl: ^0.19.0
  pdf: ^3.10.8
  flutter_highlight: ^0.7.0
  video_player: ^2.10.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
